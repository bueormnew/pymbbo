[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymbbo"
version = "0.1.1"
description = "A modular, scalable AI framework for PyPI with dynamic architecture plugins and benchmarking suite."
readme = "README.md"
authors = [
    { name = "PYMBBO Team" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "onnx>=1.12.0"
]

[project.urls]
"Homepage" = "https://github.com/bueormnew/pymbbo"
"Documentation" = "https://github.com/bueormnew/pymbbo/blob/main/DOCS.md"
